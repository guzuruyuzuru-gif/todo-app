
<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TODO管理</title>
  <script type="module" crossorigin src="/todo-app/assets/todo-DEao46-n.js"></script>
  <link rel="modulepreload" crossorigin href="/todo-app/assets/firebase-BcWdK1zH.js">
  <link rel="stylesheet" crossorigin href="/todo-app/assets/firebase-Db06NJw3.css">
</head>
<body>

  <div class="todo-container">

    <h1>TODO LIST</h1>

    <!-- ログインユーザー情報 -->
    <div class="user-info">
      <p>ログイン中：<span id="userEmail"></span></p>
      <button type="button" id="logoutButton">サインアウト</button>
    </div>

    <!-- TODO入力欄 -->
    <div class="todo-input">
      <input
        type="text"
        id="todoInput"
        placeholder="TODOを入力してください"
      >
      <button type="button" id="addButton">追加</button>
    </div>

    <!-- 表示切り替え -->
    <div class="filter-buttons">
      <button type="button" id="allButton">全て</button>
      <button type="button" id="incompleteButton">未完了</button>
      <button type="button" id="completedButton">完了</button>
    </div>

    <!-- TODO一覧 -->
    <ul id="todoList"></ul>

  </div>


</body>
</html>
